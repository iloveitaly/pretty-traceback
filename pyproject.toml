[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pretty-traceback"
description = "Human readable stacktraces."
authors = [
    {name = "Manuel Barkhau", email = "mbarkhau@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
keywords = ["traceback", "stacktrace", "pretty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "colorama>=0.4.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/mbarkhau/pretty-traceback"
Repository = "https://github.com/mbarkhau/pretty-traceback"
Issues = "https://github.com/mbarkhau/pretty-traceback/issues"

[project.entry-points.pytest11]
pretty_traceback = "pretty_traceback.pytest_plugin"

[project.optional-dependencies]
dev = [
    "pudb",
    "q",
    "py-spy",
    "snakeviz",
    "ipython",
    "pipdeptree",
    "graphviz",
    "pytest-cache",
]
test = [
    "pytest>=5.0",
    "pytest-cov",
    "pytest-html>=3.2",
]
lint = [
    "ruff",
    "mypy>=0.790",
]
build = [
    "bumpver",
    "md-toc",
    "lxml",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^(?P<version>\\d{4}\\.\\d+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/pretty_traceback"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/test",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_calls = true
follow_imports = "silent"
strict_optional = true
error_summary = false
ignore_missing_imports = true
show_error_codes = true
warn_unreachable = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
    "B905",  # `zip()` without an explicit `strict=` parameter
    "UP007", # Use `X | Y` for type annotations (not compatible with older Python)
]

exclude = [
    ".git",
    "__pycache__",
    ".eggs/",
    "dist/",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["ARG002"]  # Unused method argument (common in tests)

[tool.ruff.lint.isort]
known-first-party = ["pretty_traceback"]
force-single-line = true

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["test"]


[tool.bumpver]
current_version = "2024.1021"
version_pattern = "YYYY.BUILD[-PYTAGNUM]"
commit = true
tag = true
push = true

[[tool.bumpver.files]]
filename = "src/pretty_traceback/__init__.py"
search = '__version__ = "{version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpver.files]]
filename = "README.md"
search = "\\[CalVer {version}\\]"
replace = "[CalVer {new_version}]"

[[tool.bumpver.files]]
filename = "README.md"
search = "https://img.shields.io/static/v1.svg?label=CalVer&message={version}&color=blue"
replace = "https://img.shields.io/static/v1.svg?label=CalVer&message={new_version}&color=blue"